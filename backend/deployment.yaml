apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-container
        image: taibaton/ltw:latest
        ports:
        - containerPort: 8080
        # --- THÊM ĐOẠN DƯỚI ĐÂY VÀO ---
        env:
          - name: DB_URL
            # "mysql-service" chính là tên Service ở trên
            value: "jdbc:mysql://mysql-service:3306/qlbh?useSSL=false"
          - name: DB_USER
            value: "root"
          - name: DB_PASSWORD
            value: "123456"
